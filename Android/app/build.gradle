plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stanjk.s24musicrelay'
    compileSdk 36

    defaultConfig {
        applicationId "com.stanjk.s24musicrelay"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "0.0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Native Google liblc3 packaged as an Android AAR. We call its exported
    // 48 kHz C API directly; its Java convenience wrapper is not used.
    implementation "com.mentraglass:lc3Lib:3.4.0-dev.1103"
    implementation "net.java.dev.jna:jna:5.19.1@aar"

    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
